[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasim"
version = "0.1.0"
description = "UltraSim – Ultracycling Live Telemetry Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
build = ["pyinstaller>=6.5"]

[project.scripts]
ultrasim = "ultrasim.web.main:main"
ultrasim-simulate = "ultrasim.cli.simulate:main"
ultrasim-balance = "ultrasim.cli.balance:main"
ultrasim-calibrate = "ultrasim.cli.calibrate:main"
ultrasim-import = "ultrasim.geo.gpx_import:main"

[tool.setuptools.packages.find]
include = ["ultrasim*"]

[tool.setuptools.package-data]
ultrasim = ["web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: Läufe über eine ganze Ultradistanz (Sekunden statt Millisekunden)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
