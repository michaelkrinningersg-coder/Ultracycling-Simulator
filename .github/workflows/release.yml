name: Release

# Jeder Tag v* löst einen Windows-Build aus, der eine
# UltracyclingSimulator.exe als Release-Asset veröffentlicht
# (Game-Design-Dokument, Abschnitt 16).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

      - name: Strecken sicherstellen
        # Die Strecken liegen im Repository; falls jemand sie neu bauen
        # will, geht das hier ohne Netz und ohne Kartendienst.
        run: python -c "import pathlib,sys; sys.exit(0 if list(pathlib.Path('data/routes').glob('*.json.gz')) else 'Keine Strecken im Repository')"

      - name: EXE bauen
        run: pyinstaller ultrasim.spec --noconfirm --clean

      - name: Smoke-Test der EXE
        # Startet die Anwendung kurz und prüft, dass sie antwortet. Ein
        # Build, der nur "erfolgreich" ist, aber nicht startet, hat schon
        # oft genug ein Release gekostet.
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\UltracyclingSimulator.exe `
            -ArgumentList "--no-browser","--port","8765" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "EXE hat nicht geantwortet" }
            Write-Host "EXE antwortet."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UltracyclingSimulator-windows
          path: dist/UltracyclingSimulator.exe

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UltracyclingSimulator.exe
          generate_release_notes: true
